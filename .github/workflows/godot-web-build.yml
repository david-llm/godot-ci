# Reusable workflow: export a Godot project for the web and deploy it to GitHub Pages.
# Lives in your central repo at: .github/workflows/godot-web-build.yml
# Game repos call it with:  uses: david-llm/godot-ci/.github/workflows/godot-web-build.yml@main

name: Godot web build

on:
  workflow_call:
    inputs:
      godot-version:
        description: "Godot version, e.g. 4.7.2 (must match the editor you use)"
        type: string
        required: true
      release-flavor:
        description: "Release suffix: stable, rc1, beta2, ..."
        type: string
        default: stable
      project-path:
        description: "Folder containing project.godot, relative to the repo root"
        type: string
        default: "."
      export-preset:
        description: "Name of the Web preset in export_presets.cfg"
        type: string
        default: Web
      debug:
        description: "Use --export-debug instead of --export-release"
        type: boolean
        default: false
      blender-version:
        description: "Blender version for importing .blend files, e.g. 5.1.2. Leave empty if the project has none."
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_TAG: ${{ inputs.godot-version }}-${{ inputs.release-flavor }}
      TEMPLATE_DIR: ~/.local/share/godot/export_templates/${{ inputs.godot-version }}.${{ inputs.release-flavor }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      # Godot binary + web templates are ~1 GB to download, so cache them per version.
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_TAG }}-web

      - name: Download Godot and web export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_TAG}"
          mkdir -p ~/godot "${TEMPLATE_DIR/#\~/$HOME}"

          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_TAG}_linux.x86_64 ~/godot/godot

          # The .tpz bundles every platform; keep only the web templates.
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_TAG}_export_templates.tpz"
          unzip -q -j /tmp/templates.tpz 'templates/web_*' 'templates/version.txt' \
            -d "${TEMPLATE_DIR/#\~/$HOME}"
          rm /tmp/godot.zip /tmp/templates.tpz

      # Only needed when the project contains .blend files: Godot imports them by running Blender.
      # The Blender version must be able to read your files (Blender 5.x files need Blender 5.x).
      - name: Cache Blender
        id: cache-blender
        if: inputs.blender-version != ''
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ inputs.blender-version }}

      - name: Download Blender
        if: inputs.blender-version != '' && steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          v="${{ inputs.blender-version }}"
          series=$(echo "$v" | cut -d. -f1,2)
          curl -fsSL "https://download.blender.org/release/Blender${series}/blender-${v}-linux-x64.tar.xz" \
            | tar -xJ -C ~
          mv ~/blender-${v}-linux-x64 ~/blender

      - name: Configure Godot to use Blender
        if: inputs.blender-version != ''
        run: |
          set -euo pipefail
          # Libraries Blender needs to start in background mode.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1
          ~/blender/blender --version | head -1
          # Godot can't set the Blender path in headless mode, so write it into the editor settings.
          series=$(echo "${{ inputs.godot-version }}" | cut -d. -f1,2)
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nfilesystem/import/blender/blender_path = "%s"\n' \
            "$HOME/blender/blender" > ~/.config/godot/editor_settings-${series}.tres

      - name: Import assets
        working-directory: ${{ inputs.project-path }}
        # A fresh checkout has no .godot/ cache, so import everything first.
        # Godot exits 0 even when imports fail, so check the log; otherwise a build
        # with missing assets would deploy without complaint.
        run: |
          set -uo pipefail
          ~/godot/godot --headless --import 2>&1 | tee /tmp/import.log
          if grep -E "Error importing|Failed loading resource|Blender path is invalid" /tmp/import.log; then
            echo "::error::Some assets failed to import (see lines above)."
            exit 1
          fi

      - name: Export
        working-directory: ${{ inputs.project-path }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build/web"
          mode=${{ inputs.debug && '--export-debug' || '--export-release' }}
          ~/godot/godot --headless $mode "${{ inputs.export-preset }}" \
            "$GITHUB_WORKSPACE/build/web/index.html"
          ls -lh "$GITHUB_WORKSPACE/build/web"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
